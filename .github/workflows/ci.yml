name: CI

on:
  push:
  pull_request:

jobs:
  counterarg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI deps (light)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/CounterArg_Service/requirements.ci.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          CI: "true"
        run: |
          pytest -q
