name: CI
on: [push, pull_request]

jobs:
  counterarg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: FakeNews/backend/CounterArg_Service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: FakeNews/backend/CounterArg_Service
        run: |
          pytest -q
      - name: Build docker
        working-directory: FakeNews/backend/CounterArg_Service
        run: |
          docker build -t counterarg:ci .
